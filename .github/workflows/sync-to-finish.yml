name: Sync Code to Finish Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Start Demo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Clone target repo
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh repo clone VictorHugoBatista/reply-code-finish-demo target-repo
      
      - name: Sync, clean and push
        env:
          GH_TOKEN: ${{ secrets.TARGET_REPO_TOKEN }}
        run: |
          cd "$GITHUB_WORKSPACE/target-repo"
          
          # Configura git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main 2>/dev/null || git checkout -b main
          
          # Sync: copia arquivos do source (exceto .git e .github)
          rsync -av --exclude='.git' --exclude='.github' --exclude='target-repo' "$GITHUB_WORKSPACE/" .
          
          # Remove documentação
          rm -rf docs/ documentation/ *.md 2>/dev/null || true
          
          # Commit sync
          git add -A
          git commit -m "Sync: $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to sync"
          
          # Remove AI comments
          python3 << 'EOF'
          import re, os
          from pathlib import Path

          AI_PATTERNS = [
              r'//\s*Generated by Claude',
              r'//\s*AI-generated',
              r'/\*\s*Generated by Claude.*?\*/',
              r'#\s*Generated by Claude',
              r'"""\s*Generated by Claude.*?"""',
          ]

          EXTENSIONS = {'.js', '.ts', '.jsx', '.tsx', '.py', '.java', '.c', '.cpp', '.go', '.rb', '.php'}

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', 'node_modules'}]
              for f in files:
                  fp = Path(root) / f
                  if fp.suffix in EXTENSIONS:
                      try:
                          content = fp.read_text()
                          cleaned = content
                          for p in AI_PATTERNS:
                              cleaned = re.sub(p, '', cleaned, flags=re.IGNORECASE | re.DOTALL)
                          cleaned = re.sub(r'\n\s*\n\s*\n+', '\n\n', cleaned)
                          if cleaned != content:
                              fp.write_text(cleaned)
                              print(f"Cleaned: {fp}")
                      except: pass
          EOF
          
          # Commit AI cleanup
          git add -A
          git commit -m "Remove AI comments" || echo "No AI comments to remove"
          
          # Push
          echo "=== Final state ==="
          git log --oneline -5
          git status
          
          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/VictorHugoBatista/reply-code-finish-demo.git
          git push origin main --verbose