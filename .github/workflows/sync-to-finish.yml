name: Sync Code to Finish Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Start Demo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      
      - name: Configure Git
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
      
      - name: Add Finish Demo as remote
        run: |
          git remote add target https://x-access-token:${{ secrets.TARGET_REPO_TOKEN }}@github.com/VictorHugoBatista/reply-code-finish-demo.git
          git fetch target
      
      - name: Merge with squash (discard history)
        run: |
          git checkout main
          git merge --squash target/main || true
      
      - name: Remove documentation files
        run: |
          git rm -rf docs/ 2>/dev/null || true
          git rm -rf documentation/ 2>/dev/null || true
          git rm *.md 2>/dev/null || true
          git rm -rf *.md 2>/dev/null || true
      
      - name: Remove AI-generated comments
        run: |
          python3 << 'EOF'
          import re
          import os
          from pathlib import Path

          # Padrões de comentários gerados por IA
          AI_PATTERNS = [
              r'//\s*Generated by Claude',
              r'//\s*AI-generated',
              r'//\s*Generated by AI',
              r'/\*\s*Generated by Claude.*?\*/',
              r'#\s*Generated by Claude',
              r'#\s*AI-generated',
              r'"""\s*Generated by Claude.*?"""',
              r'//\s*This (function|code|method) was generated',
              r'//\s*Claude',
              r'#\s*Claude',
              r'//\s*Created with.*AI',
              r'//\s*Vibecoding',
          ]

          EXTENSIONS = {'.js', '.ts', '.jsx', '.tsx', '.py', '.java', '.c', '.cpp', '.go', '.rb', '.php', '.html', '.css', '.scss'}

          def remove_ai_comments(content):
              for pattern in AI_PATTERNS:
                  content = re.sub(pattern, '', content, flags=re.IGNORECASE | re.DOTALL)
              # Remove linhas vazias excessivas
              content = re.sub(r'\n\s*\n\s*\n+', '\n\n', content)
              return content

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', 'node_modules', 'venv', '__pycache__', 'dist', 'build'}]
              
              for file in files:
                  filepath = Path(root) / file
                  if filepath.suffix in EXTENSIONS:
                      try:
                          content = filepath.read_text(encoding='utf-8')
                          cleaned = remove_ai_comments(content)
                          if cleaned != content:
                              filepath.write_text(cleaned, encoding='utf-8')
                              print(f"Cleaned: {filepath}")
                      except Exception as e:
                          print(f"Error: {filepath}: {e}")
          EOF
      
      - name: Clean up formatting
        run: |
          find . -type f \( -name "*.js" -o -name "*.ts" -o -name "*.py" -o -name "*.java" -o -name "*.html" -o -name "*.css" \) -exec sed -i \
            -e 's/[[:space:]]*$//' \
            {} +
      
      - name: Commit changes
        run: |
          git add -A
          git commit -m "Sync: $(date '+%Y-%m-%d %H:%M:%S') [skip ci]" || echo "No changes to commit"
      
      - name: Push to Finish Demo
        run: |
          git push target main --force-with-lease