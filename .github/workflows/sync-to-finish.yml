name: Sync Code to Finish Demo

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        repo:
          - name: thepes
            url: thepes-technology/reply-code-finish-demo
            token: TARGET_REPO_TOKEN
            paths: "src tests"
          - name: personal
            url: VictorHugoBatista/reply-code-finish-demo
            token: PERSONAL_REPO_TOKEN
            paths: "src tests docs"

    steps:
      - name: Checkout Start Demo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Clone target repo
        env:
          GH_TOKEN: ${{ secrets[matrix.repo.token] }}
        run: |
          cd "$GITHUB_WORKSPACE"
          gh repo clone ${{ matrix.repo.url }} target-repo

      - name: Sync, clean and push
        env:
          GH_TOKEN: ${{ secrets[matrix.repo.token] }}
        run: |
          cd "$GITHUB_WORKSPACE/target-repo"

          # Configura git
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout main 2>/dev/null || git checkout -b main

          # Copia apenas os paths definidos para este repo
          # (rsync -a copia conteúdo, --delete remove apenas dentro desses paths)
          for p in ${{ matrix.repo.paths }}; do
            if [ -e "$GITHUB_WORKSPACE/$p" ]; then
              rsync -av --delete "$GITHUB_WORKSPACE/$p" .
            fi
          done

          # Remove all comments
          python3 << 'EOF'
          import re, os
          from pathlib import Path

          C_LIKE = {'.js', '.ts', '.jsx', '.tsx', '.java', '.c', '.cpp', '.go', '.php'}
          PYTHON_LIKE = {'.py', '.rb'}

          for root, dirs, files in os.walk('.'):
              dirs[:] = [d for d in dirs if d not in {'.git', 'node_modules'}]
              for f in files:
                  fp = Path(root) / f
                  if fp.suffix not in C_LIKE and fp.suffix not in PYTHON_LIKE:
                      continue
                  try:
                      content = fp.read_text()
                      cleaned = content

                      if fp.suffix in C_LIKE:
                          cleaned = re.sub(r'^[ \t]*//.*$\n', '', cleaned, flags=re.MULTILINE)
                          cleaned = re.sub(r'//.*?$', '', cleaned, flags=re.MULTILINE)
                          cleaned = re.sub(r'^[ \t]*/\*.*?\*/[ \t]*\n', '', cleaned, flags=re.MULTILINE | re.DOTALL)
                          cleaned = re.sub(r'/\*.*?\*/', '', cleaned, flags=re.DOTALL)
                      elif fp.suffix in PYTHON_LIKE:
                          cleaned = re.sub(r'^[ \t]*#.*$\n', '', cleaned, flags=re.MULTILINE)
                          cleaned = re.sub(r'#.*?$', '', cleaned, flags=re.MULTILINE)
                          cleaned = re.sub(r'^[ \t]*""".*?"""[ \t]*\n', '', cleaned, flags=re.MULTILINE | re.DOTALL)
                          cleaned = re.sub(r"^[ \t]*'''.*?'''[ \t]*\n", '', cleaned, flags=re.MULTILINE | re.DOTALL)

                      cleaned = re.sub(r'\n\s*\n\s*\n+', '\n\n', cleaned)
                      if cleaned != content:
                          fp.write_text(cleaned)
                          print(f"Cleaned: {fp}")
                  except: pass
          EOF

          # Single commit with sync timestamp
          git add -A
          git commit -m "Sync: $(date '+%Y-%m-%d %H:%M:%S')" || echo "No changes to sync"

          # Push
          echo "=== Final state ==="
          git log --oneline -5
          git status

          git remote set-url origin https://x-access-token:${GH_TOKEN}@github.com/${{ matrix.repo.url }}.git
          git push origin main --verbose